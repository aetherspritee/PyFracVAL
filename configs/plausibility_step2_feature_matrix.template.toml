# Template: Step 2 feature matrix config
#
# This file is a reference template. The concrete config used for execution is
# generated from selected boundary tuples via:
#   devenv shell -- uv run python benchmarks/build_feature_matrix_config.py #     --boundary-json benchmark_results/plausibility/step1_boundary_tuples.json #     --output-config configs/plausibility_step2_feature_matrix.toml
#
# After generation, run:
#   devenv shell -- uv run python benchmarks/run.py unified --config configs/plausibility_step2_feature_matrix.toml

[defaults]
execution_mode = "sequential"
output_root = "benchmark_results/plausibility/step2_feature_matrix"
n_values = [512, 1024]
repeats = 1
n_aggregates = 8
warmup_tasks = 1
seed_start = 1431354440
trial_timeout = 600
local_workers = 4
profile = false

[defaults.simulation]
rp_g = 1.0
tol_ov = 1.0e-6
n_subcl_percentage = 0.1
ext_case = 0

[defaults.algorithm]
use_cca_incremental_overlap = true
cca_incremental_full_sync_period = 8
cca_candidate_policy = "leaf_hybrid"
cca_score_topk_per_class = 32
cca_retry_rotation_mode = "single"
cca_retry_escalate_after = 120
cca_dual_jitter_interval = 5
cca_dual_jitter_deg = 8.0
cca_coarse_sweep_steps = 10
cca_coarse_spin_anchor_steps = 6
cca_coarse_spin_moving_steps = 6
cca_coarse_fine_coarse_fraction = 0.67
cca_coarse_fine_spin_deg = 12.0
profile_cca_retry_modes = true

# Concrete [[runs]] entries are generated by build_feature_matrix_config.py

# full_thesis_replication_sweep.toml
# A full-factorial stability sweep at thesis scale, with a wider and finer
# grid than either the thesis (Tamer Areij, TU Dortmund, 2026) or
# hard_regime_boundary_sweep.toml. Directly comparable to the thesis's own
# methodology: literal, reused seed values (1..5, not hash-derived) and
# retry-inclusive success rate (via run_simulation's standard internal
# retry loop), same as their Seed 1/2/3 convention.
#
# Grid (vs. the thesis's 6 Df x 7 kf x 3 sigma x 4 N x 3 seeds = 1512 runs):
#   Df:      1.4 to 2.6, step 0.1  -> 13 values (thesis: 1.4-2.4 step 0.2)
#   kf:      0.5 to 1.5, step 0.1  -> 11 values (thesis: 1.0-2.2 step 0.2)
#   sigma_g: 1.0, 1.25, 1.5, 1.75  ->  4 values (thesis: 1.0, 1.25, 1.5)
#   N:       128 to 1024, step 128 ->  8 values (thesis: 128,256,384,512)
#   seeds:   1, 2, 3, 4, 5         ->  5 values (thesis: 1, 2, 3)
#
# Total: 13 x 11 x 4 x 8 = 4576 combinations x 5 seeds = 22880 trials.
#
# Timing check (hardest expected corner, Df=2.6/kf=0.5/N=1024/sigma=1.75):
# ~24s (exhausts 20 internal retries). Estimated wall clock on 16 local
# cores: roughly 1.5-2 hours (~5.5x hard_regime_boundary_sweep.toml's
# 4200-trial run, which took ~20-30 min).
#
# Run with:
#   devenv shell -- uv run python benchmarks/stability_sweep.py \
#       --config configs/full_thesis_replication_sweep.toml

sizes     = [128, 256, 384, 512, 640, 768, 896, 1024]
sigmas    = [1.0, 1.25, 1.5, 1.75]

df_values = [1.4, 1.5, 1.6, 1.7, 1.8, 1.9, 2.0, 2.1, 2.2, 2.3, 2.4, 2.5, 2.6]
kf_values = [0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.1, 1.2, 1.3, 1.4, 1.5]

trials    = 5
save_raw  = false
output_dir = "benchmark_results/full_thesis_replication_sweep"

[dask]
enable = true
# scheduler_address unset -> local cluster using all available cores

[simulation]
rp_g               = 100.0
tol_ov             = 1.0e-6
n_subcl_percentage = 0.1
ext_case           = 0
# Generous relative to observed worst-case single-trial cost (~24s for the
# hardest corner at N=1024).
trial_timeout      = 90

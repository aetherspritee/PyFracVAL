# full_stability_sweep.toml
# A wide, fine-grained full-factorial stability sweep - wider and finer
# than hard_regime_boundary_sweep.toml, covering the whole Df/kf/sigma/N
# space rather than just the boundary region. Uses literal, reused seed
# values (1..5, not hash-derived) and retry-inclusive success rate (via
# run_simulation's standard internal retry loop).
#
# Grid:
#   Df:      1.4 to 2.6, step 0.1  -> 13 values
#   kf:      0.5 to 1.5, step 0.1  -> 11 values
#   sigma_g: 1.0, 1.25, 1.5, 1.75  ->  4 values
#   N:       128 to 1024, step 128 ->  8 values
#   seeds:   1, 2, 3, 4, 5         ->  5 values
#
# Total: 13 x 11 x 4 x 8 = 4576 combinations x 5 seeds = 22880 trials.
#
# Timing check (hardest expected corner, Df=2.6/kf=0.5/N=1024/sigma=1.75):
# ~24s (exhausts 20 internal retries). Actual wall clock on 16 local cores
# was ~20h, not the ~1.5-2h a naive size-scaling estimate suggested - see
# docs/source/full_stability_sweep.md for why (two real infra bugs, found
# and fixed by running at this scale).
#
# Run with:
#   devenv shell -- uv run python benchmarks/stability_sweep.py \
#       --config configs/full_stability_sweep.toml

sizes     = [128, 256, 384, 512, 640, 768, 896, 1024]
sigmas    = [1.0, 1.25, 1.5, 1.75]

df_values = [1.4, 1.5, 1.6, 1.7, 1.8, 1.9, 2.0, 2.1, 2.2, 2.3, 2.4, 2.5, 2.6]
kf_values = [0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.1, 1.2, 1.3, 1.4, 1.5]

trials    = 5
save_raw  = false
output_dir = "benchmark_results/full_stability_sweep"

[dask]
enable = true
# scheduler_address unset -> local cluster using all available cores

[simulation]
rp_g               = 100.0
tol_ov             = 1.0e-6
n_subcl_percentage = 0.1
ext_case           = 0
# Generous relative to observed worst-case single-trial cost (~24s for the
# hardest corner at N=1024).
trial_timeout      = 90

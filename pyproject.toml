[project]
name = "PyFracVAL"
version = "0.1.0"
description = "Python implementation of FracVAL for generting fractal particle clusters"
readme = "README.md"
authors = [
  { name = "aetherspritee" },
  { name = "Mirza Arnaut", email = "mirza.arnaut@tu-dortmund.de" },
]
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.11.1",
  "pyyaml>=6.0.2",
  "click>=8.1.7",
  "numba>=0.60.0",
  "numpy>=1.26.4",
  "scipy>=1.14.1",
  "tqdm>=4.66.5",
  "dask[distributed]==2026.3.0",
]

[project.optional-dependencies]
plot = [
  "pyvista[all]>=0.44.1",
  "stpyvista>=0.1.4",
  "streamlit>=1.41.1",
  "pandas>=2.2.3",
  # benchmarks/create_visualizations.py and other benchmark plotting
  # scripts import this directly - previously only available by transitive
  # luck via pyvista's own dependency on it.
  "matplotlib>=3.9.0",
]

[dependency-groups]
docs = [
  "furo>=2024.8.6",
  "myst-parser>=4.0.1",
  "linkify-it-py>=2.0.3",
  "pydata-sphinx-theme>=0.16.1",
  "sphinx-autoapi>=3.6.0",
  "sphinx-autodoc-typehints>=3.0.1",
  "sphinx-copybutton>=0.5.2",
  "sphinx>=8.1.3",
  "sphinxcontrib-bibtex>=2.6.3",
  "sphinxcontrib-napoleon>=0.7",
]
test = ["py-spy>=0.4.0", "pytest>=8.3.3"]
jax_bench = ["jax[cuda12]>=0.4.34"]

[project.scripts]
pyfracval = "pyfracval.cli:cli"

[build-system]
requires = ["uv_build >= 0.8.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pyfracval"
module-root = ""

[tool.semantic_release]
version_variable = ["pyfracval/__init__.py:__version__"]
version_toml = ["pyproject.toml:project.version:nf"]
major_on_zero = false
branch = "main"
commit_parser = "conventional"
build_command = "curl -LsSf https://astral.sh/uv/install.sh | sh && source $HOME/.local/bin/env && uv build"

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
# "update": insert new release notes below the <!-- version list --> marker
# in CHANGELOG.md, leaving everything above it (the hand-written "Unreleased"
# notes) untouched. Default mode is "init", which regenerates the whole file
# from commit history and would silently wipe out hand-written prose - see
# CHANGELOG.md for the marker placement this depends on.
mode = "update"

[tool.pyright]
exclude = [".venv"]
venvPath = "."
venv = ".venv"

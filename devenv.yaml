inputs:
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:nixos/nixpkgs/nixpkgs-unstable
    # url: github:cachix/devenv-nixpkgs/rolling

# Required for pkgs.cudaPackages_12.cudatoolkit (CUDA EULA is unfree) - needed
# for numba's CUDA target and JAX's cuda12 plugin (see devenv.nix).
allow_unfree: true
